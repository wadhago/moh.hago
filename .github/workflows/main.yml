name: Build Desktop Applications

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build target (all, windows, macos, linux)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos
          - linux

jobs:
  build-windows:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'windows' || github.event.inputs.build_target == '' }}
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: desktop/package-lock.json
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Install Node.js dependencies
      working-directory: desktop
      run: npm ci
      
    - name: Create Windows icon
      working-directory: desktop
      run: |
        # Create placeholder icon if not exists
        if (!(Test-Path "assets/icon.ico")) {
          echo "# Windows icon placeholder" > assets/icon.ico
        }
      shell: powershell
      
    - name: Build Windows executable
      working-directory: desktop
      run: npm run build:win
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v3
      with:
        name: hospital-management-windows
        path: |
          desktop/dist/*.exe
          desktop/dist/*.msi
        retention-days: 30

  build-macos:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'macos' || github.event.inputs.build_target == '' }}
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: desktop/package-lock.json
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Install Node.js dependencies
      working-directory: desktop
      run: npm ci
      
    - name: Create macOS icons
      working-directory: desktop
      run: |
        # Create placeholder icons if not exist
        mkdir -p assets
        if [ ! -f "assets/icon.icns" ]; then
          echo "# macOS icon placeholder" > assets/icon.icns
        fi
        if [ ! -f "assets/dmg-background.png" ]; then
          echo "# DMG background placeholder" > assets/dmg-background.png
        fi
        
    - name: Build macOS DMG
      working-directory: desktop
      run: npm run build:mac
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v3
      with:
        name: hospital-management-macos
        path: |
          desktop/dist/*.dmg
          desktop/dist/*.zip
        retention-days: 30

  build-linux:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'linux' || github.event.inputs.build_target == '' }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: desktop/package-lock.json
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libnss3-dev libatk-bridge2.0-dev libdrm2 libxkbcommon0 libxss1 libasound2
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Install Node.js dependencies
      working-directory: desktop
      run: npm ci
      
    - name: Create Linux icon
      working-directory: desktop
      run: |
        mkdir -p assets
        if [ ! -f "assets/icon.png" ]; then
          echo "# Linux icon placeholder" > assets/icon.png
        fi
        
    - name: Build Linux packages
      working-directory: desktop
      run: npm run build:linux
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v3
      with:
        name: hospital-management-linux
        path: |
          desktop/dist/*.AppImage
          desktop/dist/*.deb
          desktop/dist/*.rpm
        retention-days: 30

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      
    - name: Display structure of downloaded files
      run: ls -la
      
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Hospital Management System ${{ github.ref }}
        draft: false
        prerelease: false
        body: |
          ## Hospital Management System Desktop Applications
          
          ### 🏥 نظام إدارة المستشفيات - إصدار سطح المكتب
          
          This release includes desktop applications for all major platforms:
          
          ### Windows
          - **Setup.exe**: Full installer with shortcuts
          - **Portable.exe**: Portable version (no installation required)
          
          ### macOS  
          - **DMG**: Drag-and-drop installer for macOS
          - Universal binary supporting Intel and Apple Silicon
          
          ### Linux
          - **AppImage**: Universal Linux application
          - **DEB**: Debian/Ubuntu package
          
          ### Installation Instructions / تعليمات التثبيت
          
          #### Windows
          1. Download `Hospital Management System Setup.exe`
          2. Run installer and follow wizard
          3. Launch from Start Menu
          
          #### macOS
          1. Download `Hospital Management System.dmg`
          2. Open DMG and drag app to Applications
          3. Right-click → Open (first time only)
          
          #### Linux
          1. Download AppImage or DEB file
          2. For AppImage: `chmod +x *.AppImage && ./Hospital*.AppImage`
          3. For DEB: `sudo dpkg -i *.deb`
          
          ### Login Credentials / بيانات الدخول
          - Username: `admin`
          - Password: `admin123`
          
          ### Features / المميزات
          - ✅ Bilingual interface (Arabic/English) with RTL support
          - ✅ Complete hospital management modules
          - ✅ Offline functionality with local database
          - ✅ Native desktop integration
          - ✅ Multi-theme support
          
          ### System Requirements / متطلبات النظام
          - **Windows**: Windows 10/11, 4GB RAM
          - **macOS**: macOS 10.15+, 4GB RAM  
          - **Linux**: Ubuntu 18.04+/equivalent, 4GB RAM
          - **Storage**: 2GB available space
          
      
    - name: Upload Windows Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./hospital-management-windows/Hospital Management System Setup 1.0.0.exe
        asset_name: Hospital-Management-System-Setup-Windows.exe
        asset_content_type: application/octet-stream
        
    - name: Upload macOS Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./hospital-management-macos/Hospital Management System-1.0.0.dmg
        asset_name: Hospital-Management-System-macOS.dmg
        asset_content_type: application/octet-stream
        
    - name: Upload Linux AppImage Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./hospital-management-linux/Hospital Management System-1.0.0.AppImage
        asset_name: Hospital-Management-System-Linux.AppImage
        asset_content_type: application/octet-stream
